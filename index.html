<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자습실 출석 인증</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f4f6f8; padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 5px; }
    video, canvas { width: 100%; border-radius: 5px; margin-bottom: 15px; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
    .loading { color: #007bff; }
    .success { color: #28a745; }
    .fail { color: #dc3545; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📸 자습실 출석 인증</h2>
    <p>본인의 얼굴과 자습실 배경이 잘 나오게 찍어주세요.</p>

    <input type="text" id="studentId" placeholder="학번 (예: 20101)">
    <input type="text" id="studentName" placeholder="이름 (예: 김동영)">

    <!-- 카메라 화면 -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <button id="captureBtn">사진 촬영 및 인증하기</button>
    <div id="status"></div>
  </div>

  <script>
    // 💡 아래 URL을 [앱스 스크립트 새 배포 후 나오는 웹앱 URL]로 반드시 교체하세요!
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwWpEqdKrBf4NvUFXaQtqezDT3kFS7Ar1oDnUEkmyvAkDGCufeAILR2_uPp425HF24/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const statusDiv = document.getElementById('status');

    // 카메라 실행 (후면 카메라 우선)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { 
        statusDiv.innerHTML = "카메라 권한을 허용해주세요."; 
        statusDiv.className = "fail";
      });

    captureBtn.addEventListener('click', async () => {
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();

      if (!studentId || !studentName) {
        alert("학번과 이름을 모두 입력해주세요.");
        return;
      }

      // 화면 캡처
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg', 0.8);

      // UI 상태 변경
      captureBtn.disabled = true;
      statusDiv.innerHTML = "⏳ AI가 장소를 확인하고 있습니다. (약 3~5초 소요)";
      statusDiv.className = "loading";

      try {
        // Apps Script로 데이터 전송 (CORS 회피를 위해 text/plain 사용)
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({
            studentId: studentId,
            studentName: studentName,
            image: imageData
          })
        });

        const result = await response.json();

        if (result.success) {
          if (result.isMatch) {
            statusDiv.innerHTML = `✅ <b>인증 성공!</b><br><small>${result.reason}</small>`;
            statusDiv.className = "success";
          } else {
            statusDiv.innerHTML = `❌ <b>인증 실패 (지정된 자습실이 아님)</b><br><small>${result.reason}</small>`;
            statusDiv.className = "fail";
            captureBtn.disabled = false;
          }
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        statusDiv.innerHTML = "❌ 전송 중 오류가 발생했습니다. 다시 시도해주세요.";
        statusDiv.className = "fail";
        console.error(error);
        captureBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
